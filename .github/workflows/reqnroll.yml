name: Testes de API (Reqnroll)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Dias úteis, 9h de Brasília
    - cron: '0 12 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Rodar os cenários
        env:
          # Token automático do GitHub Actions: limite de 1.000 requisições por hora, em vez de 60.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test --logger "console;verbosity=detailed" --logger "trx;LogFileName=resultados.trx" --results-directory reports

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-reqnroll
          path: reports

      - name: Preparar publicação
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  deploy-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
